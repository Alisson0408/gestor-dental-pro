<script>
/* ===================== utilidades ===================== */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pct=v=>isFinite(v)&&!isNaN(v)?(v*100).toFixed(1).replace('.',',')+'%':'—';
const hoje=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDias=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const addMes=(iso,n)=>{const d=new Date(iso+'T12:00:00');const dd=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(dd,last));return d.toISOString().slice(0,10)};
const dias=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const fmtD=iso=>iso?iso.split('-').reverse().join('/'):'—';
const mesAtual=()=>hoje().slice(0,7);
const sum=(arr,f)=>arr.reduce((s,x)=>s+(+f(x)||0),0);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const digs=s=>String(s||'').replace(/\D/g,'');
const DIAS_SEM=['dom','seg','ter','qua','qui','sex','sáb'];

/* ===================== estado ===================== */
const COLS=['pacientes','agenda','orcamentos','receber','guias','estoque','caixa','procedimentos','espera','pagar'];
const COLS_CLIN=['anamneses','odontogramas','evolucoes'];const ALLC=[...COLS,...COLS_CLIN];
let CLIN_OK=true;
const CFG0={nome:'Minha Clínica',dentista:'',custoFixo:15000,horasMes:140,impostos:6,taxaCartao:3.5,margemAlvo:30,ticket:250,diasRetorno:180,cro:'',endereco:'',cidade:'',ultimoBackup:'',chavePix:'',favorecidoPix:'',saldoBanco:0,saldoData:''};
const S={config:{...CFG0}};ALLC.forEach(c=>S[c]=[]);
const UI={pacSel:null,prTab:'odonto',view:'painel',dataAg:hoje(),q:'',orcTab:'aberto',finTab:'receber',mesCx:mesAtual(),cvTab:'todas'};
const C=()=>({...CFG0,...S.config});
const LSK_DEMO='gestor_dental_pro_demo_v1';
let DB=null,mode='local';
let sb=null,USER=null,ADMIN=false,CLINICAS=[],CLIN=null,PAPEL=null,CANAL=null;
const TAB=c=>COLS_CLIN.includes(c)?'clinicos':'registros';
const ativa=c=>!!c&&c.status!=='bloqueado'&&c.vencimento>=hoje();

function lsLoad(){try{const j=JSON.parse(localStorage.getItem(LSK_DEMO)||'null');if(j){S.config={...CFG0,...(j.config||{})};ALLC.forEach(c=>S[c]=Array.isArray(j[c])?j[c]:[])}}catch(e){}}
function lsSave(){if(mode!=='local')return;try{localStorage.setItem(LSK_DEMO,JSON.stringify(S))}catch(e){}}

const clean=o=>JSON.parse(JSON.stringify(o));
function erroSB(e){const m=String((e&&e.message)||e||'');
 toast(/row-level security|violates|permission/i.test(m)?'Sem permissão para esta ação, ou a assinatura venceu. Atualize a página.':/prontu[aá]rio/i.test(m)?m:/fetch|network|Failed/i.test(m)?'Sem internet. A alteração não foi salva — tente de novo.':'Não foi possível salvar: '+m)}
function linha(col,obj){return {clinica_id:CLIN.id,colecao:col,id:obj.id,dados:clean(obj)}}
async function put(col,obj){
 if(!obj.id)obj.id=uid();
 const arr=S[col];const i=arr.findIndex(x=>x.id===obj.id);
 if(i>=0)arr[i]=obj;else arr.push(obj);
 render();
 if(mode==='nuvem'){const q=col==='evolucoes'?sb.from('clinicos').upsert(linha(col,obj),{onConflict:'clinica_id,colecao,id',ignoreDuplicates:true}):sb.from(TAB(col)).upsert(linha(col,obj));
  const {error}=await q;if(error)erroSB(error)}else lsSave();
 return obj;
}
async function del(col,id){
 const antes=S[col];S[col]=S[col].filter(x=>x.id!==id);render();
 if(mode==='nuvem'){const {error}=await sb.from(TAB(col)).delete().match({clinica_id:CLIN.id,colecao:col,id});if(error){S[col]=antes;render();erroSB(error)}}else lsSave();
}
async function saveCfg(cfg){
 S.config={...C(),...cfg};render();
 if(mode==='nuvem'){if(PAPEL!=='dono'){toast('Apenas o dono altera as configurações.');return}
  const {error}=await sb.rpc('salvar_config',{p_clinica:CLIN.id,p_config:clean(cfg)});if(error)erroSB(error);else{CLIN.config={...(CLIN.config||{}),...cfg};if(cfg.nome)CLIN.nome=cfg.nome;montarLateral()}}
 else lsSave();
}
function temaBtn(){const b=document.getElementById('temabtn');if(!b)return;const e=document.documentElement.dataset.tema==='escuro';b.innerHTML=`<span>${e?'🌙':'☀️'}</span><span class="tl">Modo escuro<small>${e?'Ativado':'Desativado'}</small></span><i class="sw"><b></b></i>`}
function trocaTema(){const r=document.documentElement,e=r.dataset.tema!=='escuro';if(e)r.dataset.tema='escuro';else delete r.dataset.tema;try{localStorage.setItem('gd_tema',e?'escuro':'claro')}catch(_){}temaBtn()}
document.addEventListener('DOMContentLoaded',temaBtn);
function setSync(ok,txt){const el=$('#syncSt');if(el)el.innerHTML=`<i style="background:${ok?'#3ccf8e':'#e0a33a'}"></i>${esc(txt)}`}

/* ===================== helpers de domínio ===================== */
const pac=id=>S.pacientes.find(p=>p.id===id)||{nome:'(paciente removido)',tel:''};
const pNome=id=>esc(pac(id).nome);
function waLink(tel,msg){let n=digs(tel);if(!n)return '';if(n.length<=11)n='55'+n;return 'https://wa.me/'+n+'?text='+encodeURIComponent(msg)}
function waBtn(tel,msg,label='WhatsApp',extra=''){const h=waLink(tel,msg);return h?`<a class="btn s wa" target="_blank" rel="noopener" href="${esc(h)}" ${extra}>${label}</a>`:`<span class="btn s" aria-disabled="true" title="Sem telefone">${label}</span>`}
const primeiro=n=>{const w=String(n||'').trim().split(/\s+/);return /^dr[a]?\.?$/i.test(w[0])&&w[1]?w[0]+' '+w[1]:w[0]};
const custoHora=()=>{const c=C();return c.horasMes>0?c.custoFixo/c.horasMes:0};
function calcProc(p){
 const c=C();const ch=custoHora();
 const custo=(+p.minutos||0)/60*ch+(+p.material||0)+(+p.lab||0);
 const deduz=(c.impostos+c.taxaCartao)/100;
 const liqP=(+p.precoParticular||0)*(1-deduz);
 const liqC=(+p.precoConvenio||0)*(1-c.impostos/100);
 const den=1-deduz-c.margemAlvo/100;
 return {custo,liqP,margemP:liqP-custo,margemPp:p.precoParticular?(liqP-custo)/p.precoParticular:NaN,
  liqC,margemC:p.precoConvenio?liqC-custo:null,sugerido:den>0?custo/den:NaN};
}
function retornoList(){
 const t=hoje(),lim=C().diasRetorno;
 const futuros=new Set(S.agenda.filter(a=>a.data>=t&&a.status!=='cancelado').map(a=>a.pacienteId));
 return S.pacientes.filter(p=>!futuros.has(p.id)&&(!p.ultimaVisita||dias(p.ultimaVisita,t)>=lim))
  .map(p=>({...p,d:p.ultimaVisita?dias(p.ultimaVisita,t):null})).sort((a,b)=>(b.d??1e9)-(a.d??1e9));
}
function metricas(){
 const t=hoje(),m=mesAtual(),c=C();
 const agM=S.agenda.filter(a=>(a.data||'').startsWith(m)&&a.data<=t);
 const faltas=agM.filter(a=>a.status==='faltou'),comp=agM.filter(a=>a.status==='compareceu');
 const perdaFaltas=sum(faltas,a=>+a.valor||c.ticket);
 const abertos=S.orcamentos.filter(o=>o.status==='aberto');
 const parados=abertos.filter(o=>dias(o.ultimoContato||o.data,t)>7);
 const desde=addDias(t,-90);const rec=S.orcamentos.filter(o=>o.data>=desde);
 const aprov=rec.filter(o=>o.status==='aprovado');
 const vencidas=S.receber.filter(r=>!r.pago&&r.venc<t);
 const emitidas=S.receber.filter(r=>r.venc<t);
 const glosas=S.guias.filter(g=>g.status==='glosada');
 const perdaGlosa=sum(glosas,g=>(+g.valor)-(+g.valorPago||0));
 const fatur=S.guias.filter(g=>g.status==='paga'||g.status==='glosada');
 const cx=S.caixa.filter(x=>(x.data||'').startsWith(m));
 const ent=sum(cx.filter(x=>x.tipo==='entrada'),x=>x.valor),sai=sum(cx.filter(x=>x.tipo==='saida'),x=>x.valor);
 return {faltas,comp,perdaFaltas,taxaFaltas:faltas.length/(faltas.length+comp.length),
  abertos,parados,perdaOrc:sum(parados,o=>o.total),valorAberto:sum(abertos,o=>o.total),conv:aprov.length/rec.length,
  vencidas,perdaInad:sum(vencidas,r=>r.valor),inad:sum(vencidas,r=>r.valor)/sum(emitidas,r=>r.valor),
  glosas,perdaGlosa,pGlosa:perdaGlosa/sum(fatur,g=>g.valor),
  ent,sai,retorno:retornoList(),estBaixo:S.estoque.filter(e=>+e.qtd<=+e.min)};
}

/* ===================== modais ===================== */
let modalCb=null;
function abrirModal(html){$('#md').classList.remove('wide');$('#md').innerHTML=html;$('#ov').classList.add('on');setTimeout(()=>{const f=$('#md').querySelector('input,select,textarea');if(f&&window.innerWidth>700)f.focus()},50)}
function fecharModal(){$('#ov').classList.remove('on');modalCb=null}
$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')fecharModal()});
function campo(f,v){
 const id='f_'+f.k;v=v??f.def??'';
 let ctl;
 if(f.type==='select')ctl=`<select class="inp" id="${id}">${f.options.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
 else if(f.type==='paciente'){const ps=[...S.pacientes].sort((a,b)=>a.nome.localeCompare(b.nome));ctl=`<select class="inp" id="${id}"><option value="">Selecione o paciente…</option>${ps.map(p=>`<option value="${p.id}" ${p.id===v?'selected':''}>${esc(p.nome)}</option>`).join('')}</select>`}
 else if(f.type==='textarea')ctl=`<textarea class="inp" id="${id}" rows="3" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
 else ctl=`<input class="inp" id="${id}" type="${f.type||'text'}" ${f.type==='number'?'step="any" inputmode="decimal"':''} value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
 return `<div class="f"><label for="${id}">${esc(f.label)}</label>${ctl}${f.help?`<span class="small muted">${esc(f.help)}</span>`:''}</div>`;
}
function form(title,fields,init,onSave,saveLabel='Salvar'){
 init=init||{};
 let body='',i=0;
 while(i<fields.length){const f=fields[i];
  if(f.half&&fields[i+1]&&fields[i+1].half){body+=`<div class="frow">${campo(f,init[f.k])}${campo(fields[i+1],init[fields[i+1].k])}</div>`;i+=2}
  else{body+=campo(f,init[f.k]);i++}}
 abrirModal(`<form id="frm"><header><h2>${esc(title)}</h2><button type="button" class="x" data-act="fechar">✕</button></header><div class="bd">${body}</div><footer><button type="button" class="btn" data-act="fechar">Cancelar</button><button class="btn p" type="submit">${esc(saveLabel)}</button></footer></form>`);
 $('#frm').addEventListener('submit',async e=>{e.preventDefault();
  const v={};fields.forEach(f=>{const el=$('#f_'+f.k);let x=el.value;if(f.type==='number')x=x===''?0:parseFloat(String(x).replace(',','.'))||0;v[f.k]=typeof x==='string'?x.trim():x});
  for(const f of fields){if(f.req&&(v[f.k]===''||v[f.k]==null)){toast('Preencha: '+f.label);return}}
  const r=await onSave(v);if(r!==false)fecharModal()});
}
function ask(msg,ok='Confirmar',danger=false){return new Promise(res=>{
 abrirModal(`<header><h2>Confirmação</h2></header><div class="bd"><p style="margin:4px 0 6px;line-height:1.5">${msg}</p></div><footer><button class="btn" id="aN">Cancelar</button><button class="btn ${danger?'d':'p'}" id="aY">${esc(ok)}</button></footer>`);
 $('#aN').onclick=()=>{fecharModal();res(false)};$('#aY').onclick=()=>{fecharModal();res(true)};})}
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),3200)}

/* ===================== navegação ===================== */

 ['painel','Painel','M3 12l9-8 9 8M5 10v10h14V10'],
 ['agenda','Agenda e faltas','M7 3v3M17 3v3M4 8h16M5 5h14v15H5z'],

];

 const badge={cobranca:filaLembretes().filter(x=>!x.hojeOk).length,previsao:previsao(30).neg?'!':0,agenda:0,orcamentos:m.parados.length,financeiro:m.vencidas.length,retorno:m.retorno.length,estoque:m.estBaixo.length,convenios:S.guias.filter(g=>g.status==='enviada'&&dias(g.data,hoje())>30).length,admin:UI.avN||0};

/* ===================== PAINEL ===================== */
function vPainel(m){
 const c=C(),t=hoje(),am=addDias(t,1);
 const total=m.perdaFaltas+m.perdaOrc+m.perdaInad+m.perdaGlosa;
 const semDados=!S.pacientes.length;
 const todos=[];
 S.agenda.filter(a=>a.data===am&&a.status==='agendado').forEach(a=>{const p=pac(a.pacienteId);
  todos.push({ic:'📅',bg:'var(--blubg)',t:`Confirmar consulta de amanhã — ${esc(p.nome)}`,s:`${a.hora||''} · ${esc(a.proc||'Consulta')}`,

function gerarParcelas(pacienteId,desc,total,n,primeiro,entrada=0,forma='Pix'){
 const out=[];n=Math.max(1,Math.round(n||1));
 const resto=Math.max(0,total-entrada);const base=Math.floor(resto/n*100)/100;let acum=0;
 for(let i=0;i<n;i++){const v=i===n-1?Math.round((resto-acum)*100)/100:base;acum+=v;out.push({id:uid(),pacienteId,desc:`${desc} (${i+1}/${n})`,valor:v,venc:addMes(primeiro,i),pago:false,forma})}
 return out;
}

const EST={higido:['Hígido','#ffffff','#9fb0bb'],cariado:['Cárie (tratar)','#f6c4c4','#cf3f3f'],extrair:['Indicado extrair','#f6c4c4','#cf3f3f',1],fratura:['Fraturado','#fbe0c4','#c0641a'],
 restaurado:['Restaurado','#c9d8fb','#2459c9'],canal:['Canal tratado','#ddd0f7','#6b46c1'],coroa:['Coroa / prótese','#f3e2b8','#a8791d'],implante:['Implante','#b9e3d3','#1d845a'],ausente:['Ausente','#e6eaee','#8b98a3',1]};
const SUP=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28],INF=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const FACES=[['M','Mesial'],['D','Distal'],['O','Oclusal/Incisal'],['V','Vestibular'],['L','Lingual/Palatina']];
const ANAM_TXT=[['queixa','Queixa principal / motivo da consulta','textarea'],['tratMedico','Está em tratamento médico? Qual?'],['medicamentos','Medicamentos em uso'],['alergias','Alergias (medicamentos, látex, anestésicos, alimentos)'],['cirurgias','Cirurgias ou internações anteriores'],['pa','Pressão arterial aferida'],['obs','Outras observações','textarea']];
const ANAM_CHK=[['hipertensao','Hipertensão'],['diabetes','Diabetes'],['cardiaco','Problema cardíaco'],['coagulacao','Problema de coagulação / sangramento'],['anticoagulante','Usa anticoagulante'],['hepatite','Hepatite'],['infecto','Outra doença infectocontagiosa'],['respiratorio','Asma / problema respiratório'],['convulsao','Epilepsia / convulsões'],['gestante','Gestante ou amamentando'],['fumante','Fumante'],['bruxismo','Range ou aperta os dentes'],['reacaoAnestesia','Já teve reação a anestesia'],['sangramentoGengiva','Sangramento na gengiva']];
const RISCO=['coagulacao','anticoagulante','cardiaco','gestante','hipertensao','diabetes','reacaoAnestesia','convulsao'];
const anam=id=>S.anamneses.find(a=>a.id===id);
const odo=id=>S.odontogramas.find(o=>o.id===id)||{id,pacienteId:id,dentes:{},itens:[]};
const evos=id=>S.evolucoes.filter(e=>e.pacienteId===id).sort((a,b)=>(b.dataHora||'').localeCompare(a.dataHora||'')||(b.registradoEm||'').localeCompare(a.registradoEm||''));
const temProntuario=id=>!!(anam(id)||S.odontogramas.find(o=>o.id===id)||S.evolucoes.some(e=>e.pacienteId===id));
const idade=n=>{if(!n)return '';const d=new Date(n+'T12:00:00'),h=new Date();let a=h.getFullYear()-d.getFullYear();if(h<new Date(h.getFullYear(),d.getMonth(),d.getDate()))a--;return a+' anos'};
const agoraLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const fmtDH=s=>s?fmtD(s.slice(0,10))+(s.length>10?' '+s.slice(11,16):''):'—';
function alertas(id){const a=anam(id);if(!a)return '';const d=a.dados||{};let h='';
 if(d.alergias)h+=`<span class="pill" style="background:var(--red);color:#fff">⚠ Alergia: ${esc(d.alergias)}</span> `;
 RISCO.filter(k=>d[k]).forEach(k=>h+=`<span class="pill amb">${esc(ANAM_CHK.find(x=>x[0]===k)[1])}</span> `);return h}
function dente(n,o){const d=(o.dentes||{})[n]||{};const e=EST[d.estado]||EST.higido;const sup=n<30;const plan=(o.itens||[]).some(i=>String(i.dente)===String(n)&&i.status!=='realizado');
 return `<button class="tooth" data-act="dente" data-n="${n}" title="Dente ${n} — ${e[0]}${d.faces?' ('+esc(d.faces)+')':''}">${sup?`<small>${n}</small>`:''}<svg viewBox="0 0 24 24"><g transform="${sup?'rotate(180 12 12)':''}"><path d="${TOOTH}" fill="${e[1]}" stroke="${e[2]}" stroke-width="1.4"/></g>${e[3]?`<path d="M6 6L18 18M18 6L6 18" stroke="${e[2]}" stroke-width="2" stroke-linecap="round"/>`:''}${plan?'<circle cx="20" cy="4" r="3" fill="#cf3f3f"/>':''}</svg>${sup?'':`<small>${n}</small>`}</button>`}

function vProntuario(){
 if(!CLIN_OK)return topo('Prontuários')+`<div class="card">${vazio('Acesso restrito','Os dados clínicos dos pacientes ficam visíveis apenas para o(a) dentista responsável.')}</div>`;
 const id=UI.pacSel;const p=S.pacientes.find(x=>x.id===id);
 if(!p){const q=norm(UI.q);const ls=S.pacientes.filter(x=>!q||norm(x.nome).includes(q)).sort((a,b)=>a.nome.localeCompare(b.nome));
  return topo('Prontuários','Odontograma, anamnese, evolução clínica e documentos para assinatura')+
  `<div class="card"><div class="bar"><input class="inp" id="busca" placeholder="Buscar paciente…" value="${esc(UI.q)}" style="flex:1;max-width:420px"></div>
  ${ls.length?`<div class="tw"><table><tbody>${ls.map(x=>`<tr><td><b>${esc(x.nome)}</b> ${alertas(x.id)}<div class="small muted">${idade(x.nasc)}${temProntuario(x.id)?' · prontuário iniciado':' · sem prontuário'}</div></td><td><div class="acts"><button class="btn s p" data-act="abrirPront" data-id="${x.id}">Abrir prontuário</button></div></td></tr>`).join('')}</tbody></table></div>`:vazio('Nenhum paciente','Cadastre pacientes para abrir prontuários.',`<a class="btn p" href="#pacientes">Ir para pacientes</a>`)}</div>`}
 const tab=UI.prTab||'odonto';
 const head=topo(esc(p.nome),`${[idade(p.nasc),p.convenio||'Particular',p.tel].filter(Boolean).map(esc).join(' · ')}`,`<button class="btn" data-act="fecharPront">‹ Voltar</button>`)+
  (alertas(id)?`<div style="margin:-6px 0 14px;display:flex;gap:6px;flex-wrap:wrap">${alertas(id)}</div>`:(anam(id)?'':`<div class="note" style="margin-bottom:14px">Anamnese ainda não preenchida. Preencha antes do primeiro procedimento.</div>`))+
  `<div class="bar"><div class="tabs">${[['odonto','Odontograma e plano'],['anam','Anamnese'],['evo','Evolução clínica'],['docs','Documentos']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="prTab" data-t="${k}">${l}</button>`).join('')}</div></div>`;
 if(tab==='anam')return head+vAnam(p);
 if(tab==='evo')return head+vEvo(p);
 if(tab==='docs')return head+vDocs(p);
 const o=odo(id);const itens=o.itens||[];const plan=itens.filter(i=>i.status==='planejado');
 return head+`<div class="card" style="margin-bottom:14px"><h3>Odontograma <span class="small muted" style="font-weight:500">— toque em um dente para registrar a situação ou planejar um procedimento</span></h3>
 <div class="odo"><div class="arc">${SUP.slice(0,8).map(n=>dente(n,o)).join('')}<span class="sep"></span>${SUP.slice(8).map(n=>dente(n,o)).join('')}</div><div class="arc">${INF.slice(0,8).map(n=>dente(n,o)).join('')}<span class="sep"></span>${INF.slice(8).map(n=>dente(n,o)).join('')}</div></div>
 <div class="leg" style="margin-top:10px">${Object.values(EST).map(e=>`<span><i style="background:${e[1]};border:1.5px solid ${e[2]}"></i>${e[0]}</span>`).join('')}<span><i style="background:#cf3f3f;border-radius:50%"></i>Procedimento planejado</span></div></div>
 <div class="card"><h3 style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">Plano de tratamento <span style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn s" data-act="itemPlano">+ Procedimento geral</button>${plan.length?`<button class="btn s g" data-act="gerarOrc">Gerar orçamento (${plan.length} itens · ${brl(sum(plan,i=>i.valor))})</button>`:''}</span></h3>
 ${itens.length?`<div class="tw"><table><thead><tr><th>Dente</th><th>Procedimento</th><th>Valor</th><th>Status</th><th class="right">Ações</th></tr></thead><tbody>${itens.map(i=>`<tr><td>${i.dente?'<b>'+esc(i.dente)+'</b>'+(i.faces?' <span class="small muted">'+esc(i.faces)+'</span>':''):'<span class="muted">geral</span>'}</td><td>${esc(i.proc)}</td><td class="nowrap">${brl(i.valor)}</td><td>${i.status==='realizado'?`<span class="pill grn">Realizado ${fmtD(i.dataReal)}</span>`:i.status==='orcado'?'<span class="pill blu">Orçado</span>':'<span class="pill amb">Planejado</span>'}</td>
 <td><div class="acts">${i.status!=='realizado'?`<button class="btn s p" data-act="itemFeito" data-i="${i.id}">Realizado</button>`:''}${i.status==='planejado'?`<button class="btn s d" data-act="itemDel" data-i="${i.id}">✕</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted small">Nenhum procedimento planejado. Toque em um dente do odontograma para adicionar.</p>'}
 <p class="small muted" style="margin:10px 0 0">Ao gerar o orçamento, ele entra no funil de follow-up. Ao marcar “Realizado”, o registro vai automaticamente para a evolução clínica.</p></div>`;
}
function vAnam(p){const a=anam(p.id);const d=(a&&a.dados)||{};
 return `<div class="card"><h3>Anamnese ${a?`<span class="small muted" style="font-weight:500">— atualizada em ${fmtDH(a.atualizadoEm)}${(a.historico||[]).length?' · '+a.historico.length+' versão(ões) anterior(es) guardada(s)':''}</span>`:''}</h3>
 <form id="anamFrm">${ANAM_TXT.slice(0,4).map(([k,l,t])=>`<div class="f"><label>${l}</label>${t==='textarea'?`<textarea class="inp" name="${k}" rows="2">${esc(d[k])}</textarea>`:`<input class="inp" name="${k}" value="${esc(d[k])}">`}</div>`).join('')}
 <div class="f"><label>Marque o que se aplica</label><div class="chk">${ANAM_CHK.map(([k,l])=>`<label><input type="checkbox" name="${k}" ${d[k]?'checked':''}> ${l}</label>`).join('')}</div></div>
 ${ANAM_TXT.slice(4).map(([k,l,t])=>`<div class="f"><label>${l}</label>${t==='textarea'?`<textarea class="inp" name="${k}" rows="2">${esc(d[k])}</textarea>`:`<input class="inp" name="${k}" value="${esc(d[k])}">`}</div>`).join('')}
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" type="submit">Salvar anamnese</button><button class="btn" type="button" data-act="pdf" data-t="anamnese">Imprimir para assinatura</button></div>
 <p class="small muted">Alterações guardam a versão anterior. Imprima e colha a assinatura do paciente sempre que a anamnese for atualizada.</p></form></div>`}
function vEvo(p){const ls=evos(p.id);const ret=new Set(ls.filter(e=>e.retificaId).map(e=>e.retificaId));
 return `<div class="card" style="margin-bottom:14px"><h3>Novo registro</h3><form id="evoFrm"><div class="frow"><div class="f"><label>Data e hora do atendimento</label><input class="inp" type="datetime-local" name="dataHora" value="${agoraLocal()}"></div><div class="f"><label>Dente(s)</label><input class="inp" name="dentes" placeholder="Ex.: 16, 17"></div></div>
 <div class="f"><label>Procedimento</label><input class="inp" name="proc" list="dlProc" placeholder="Ex.: Restauração em resina"></div>
 <div class="f"><label>Descrição do atendimento</label><textarea class="inp" name="texto" rows="4" placeholder="Procedimento realizado, materiais, anestesia, intercorrências, orientações…" required></textarea></div>
 <datalist id="dlProc">${S.procedimentos.map(x=>`<option value="${esc(x.nome)}">`).join('')}</datalist>
 <button class="btn p" type="submit">Registrar no prontuário</button><p class="small muted">Por exigência ética, registros não podem ser editados nem apagados. Para corrigir, use “Retificar”: o original continua visível.</p></form></div>
 <div class="card"><h3>Histórico (${ls.length})</h3>${ls.length?ls.map(e=>`<div class="evo ${e.retificaId?'ret':''} ${ret.has(e.id)?'old':''}"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${fmtDH(e.dataHora)}${e.proc?' · '+esc(e.proc):''}${e.dentes?' · dente(s) '+esc(e.dentes):''}</b><span>${e.retificaId?'<span class="pill amb">Retificação</span>':''}${ret.has(e.id)?'<span class="pill gry">Retificado</span>':''}</span></div>
 <div style="white-space:pre-wrap;margin:6px 0">${esc(e.texto)}</div><div class="small muted">${esc(e.responsavel||'')} · registrado em ${fmtDH((e.registradoEm||'').slice(0,16))}${e.retificaId?' · corrige o registro de '+fmtDH((S.evolucoes.find(x=>x.id===e.retificaId)||{}).dataHora):''}</div>
 ${!ret.has(e.id)?`<button class="btn s" style="margin-top:6px" data-act="retificar" data-id="${e.id}">Retificar</button>`:''}</div>`).join(''):'<p class="muted small">Nenhum atendimento registrado.</p>'}</div>`}
function vDocs(p){const docs=[['anamnese','Ficha de anamnese','Histórico de saúde com declaração do paciente'],['plano','Plano de tratamento e orçamento','Situação dos dentes, procedimentos e valores'],['tcle','Termo de consentimento do tratamento','Riscos, alternativas e concordância com o plano'],['lgpd','Termo de consentimento LGPD','Autorização para tratamento de dados pessoais e de saúde'],['completo','Prontuário completo','Anamnese, odontograma, plano e evolução clínica para arquivo']];
 return `<div class="note blue" style="margin-bottom:14px">Os documentos saem em PDF prontos para imprimir. <b>A validade depende da assinatura em papel</b> do paciente (ou responsável) e do(a) dentista. Guarde as vias assinadas por no mínimo 10 anos após o último atendimento.</div>
 ${!C().cro?'<div class="note" style="margin-bottom:14px">Preencha o nome do(a) dentista, o CRO e o endereço em <a href="#config">Configurações</a> para que apareçam nos documentos.</div>':''}
 <div class="ocards">${docs.map(([k,t,s])=>`<div class="oc"><b>${t}</b><div class="small muted">${s}</div><div><button class="btn s p" data-act="pdf" data-t="${k}">Gerar PDF</button></div></div>`).join('')}</div>`}

function modalDente(n){
 const id=UI.pacSel,o=odo(id),d=(o.dentes||{})[n]||{};const fs=String(d.faces||'');
 abrirModal(`<form id="dFrm"><header><h2>Dente ${n}</h2><button type="button" class="x" data-act="fechar">✕</button></header><div class="bd">
 <div class="f"><label>Situação atual</label><select class="inp" name="estado">${Object.entries(EST).map(([k,e])=>`<option value="${k}" ${(d.estado||'higido')===k?'selected':''}>${e[0]}</option>`).join('')}</select></div>
 <div class="f"><label>Faces envolvidas</label><div class="chk" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${FACES.map(([k,l])=>`<label><input type="checkbox" name="f_${k}" ${fs.includes(k)?'checked':''}> ${l}</label>`).join('')}</div></div>
 <div class="f"><label>Observação</label><input class="inp" name="obs" value="${esc(d.obs)}"></div>
 <div style="border-top:1px solid var(--line);margin:6px 0 12px;padding-top:12px"><b class="small">Planejar procedimento neste dente (opcional)</b></div>
 <div class="frow"><div class="f"><label>Procedimento</label><input class="inp" name="proc" list="dlProc2" placeholder="Ex.: Restauração em resina"><datalist id="dlProc2">${S.procedimentos.map(x=>`<option value="${esc(x.nome)}">`).join('')}</datalist></div><div class="f"><label>Valor (R$)</label><input class="inp" name="valor" type="number" step="any" placeholder="automático"></div></div>
 </div><footer><button type="button" class="btn" data-act="fechar">Cancelar</button><button class="btn p" type="submit">Salvar</button></footer></form>`);
 const f=$('#dFrm');
 f.proc.addEventListener('change',()=>{const pr=S.procedimentos.find(x=>norm(x.nome)===norm(f.proc.value));if(pr&&!f.valor.value)f.valor.value=pr.precoParticular});
 f.addEventListener('submit',async e=>{e.preventDefault();
  const faces=FACES.filter(([k])=>f['f_'+k].checked).map(([k])=>k).join('');
  const novo={...o,pacienteId:id,dentes:{...(o.dentes||{}),[n]:{estado:f.estado.value,faces,obs:f.obs.value.trim()}},itens:[...(o.itens||[])],atualizadoEm:agoraLocal()};
  const proc=f.proc.value.trim();if(proc){const pr=S.procedimentos.find(x=>norm(x.nome)===norm(proc));novo.itens.push({id:uid(),dente:String(n),faces,proc,valor:parseFloat(f.valor.value)||(pr?pr.precoParticular:0),status:'planejado'})}
  fecharModal();await put('odontogramas',novo);toast(proc?'Dente atualizado e procedimento planejado':'Dente atualizado')});
}
async function addEvo(pacId,v){return put('evolucoes',{id:uid(),pacienteId:pacId,registradoEm:new Date().toISOString(),responsavel:[C().dentista,C().cro?'CRO '+C().cro:''].filter(Boolean).join(' — '),...v})}

/* ---------- PDF ---------- */
let jsPDFp=null;
function loadJsPDF(){if(window.jspdf)return Promise.resolve(window.jspdf.jsPDF);if(!jsPDFp)jsPDFp=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=()=>res(window.jspdf.jsPDF);s.onerror=()=>{jsPDFp=null;rej()};document.head.appendChild(s)});return jsPDFp}
async function entregar(nome,data){
 let dl=null;try{if(window.claude&&typeof window.claude.use==='function')dl=await window.claude.use('downloads')}catch(e){}
 if(!dl){try{const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement('a');a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),8000);return true}catch(e){toast('Download indisponível nesta visualização');return false}}
 try{await dl.save({filename:nome,data});toast('Arquivo pronto ✓');return true}catch(e){toast(e&&e.code==='declined'?'Download cancelado':'Não foi possível baixar agora');return false}}
function mkPDF(J,titulo,p){
 const doc=new J({unit:'mm',format:'a4'});const W=210,M=18,c=C();let y=0;
 const header=()=>{doc.setFillColor(10,61,68);doc.rect(0,0,W,4,'F');doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(10,61,68);doc.text(c.nome||'',M,13);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(95);
  doc.text([c.dentista?(c.dentista+(c.cro?' — CRO '+c.cro:'')):'',c.endereco||''].filter(Boolean).join('   ·   '),M,18.5);doc.setDrawColor(215);doc.line(M,21.5,W-M,21.5);y=30};
 const ensure=h=>{if(y+h>278){doc.addPage();header()}};
 const A={doc,
  h(t){ensure(12);y+=2;doc.setFont('helvetica','bold');doc.setFontSize(11.5);doc.setTextColor(10,61,68);doc.text(t,M,y);y+=6.5},
  p(t,sz=10){doc.setFont('helvetica','normal');doc.setFontSize(sz);doc.setTextColor(30);doc.splitTextToSize(String(t),W-2*M).forEach(l=>{ensure(5.2);doc.text(l,M,y);y+=sz*0.5});y+=2},
  kv(k,v){doc.setFontSize(9.5);doc.setFont('helvetica','normal');const ls=doc.splitTextToSize(String(v||'—'),W-2*M-64);doc.setFont('helvetica','bold');const lk=doc.splitTextToSize(k,60);const n=Math.max(ls.length,lk.length);ensure(n*4.6+1);doc.setTextColor(85);doc.text(lk,M,y);doc.setFont('helvetica','normal');doc.setTextColor(20);doc.text(ls,M+64,y);y+=Math.max(5.8,n*4.6+1.4)},
  table(cols,rows,ws){const tot=W-2*M;ws=(ws||cols.map(()=>1/cols.length)).map(x=>x*tot);
   const row=(cells,b)=>{doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(9);const ls=cells.map((t,i)=>doc.splitTextToSize(String(t??''),ws[i]-3));const h=Math.max(...ls.map(l=>l.length))*4.3+2.6;ensure(h+1);
    if(b){doc.setFillColor(236,241,244);doc.rect(M,y-4,tot,h,'F')}let x=M;ls.forEach((l,i)=>{doc.setTextColor(b?60:25);doc.text(l,x+1.5,y);x+=ws[i]});y+=h;doc.setDrawColor(225);doc.line(M,y-4,M+tot,y-4)};
   ensure(16);row(cols,true);rows.forEach(r=>row(r));y+=2},
  gap(n=4){y+=n},
  sig(labels){ensure(36);y+=18;const g=10,w=(W-2*M-g*(labels.length-1))/labels.length;labels.forEach((l,i)=>{const x=M+i*(w+g);doc.setDrawColor(60);doc.line(x,y,x+w,y);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(70);doc.text(doc.splitTextToSize(l,w),x,y+4.5)});y+=16},
  local(){ensure(10);doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(30);doc.text(`${c.cidade||'_______________'}, ${new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'})}.`,M,y);y+=6},
  async save(nome){const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(140);
    doc.text(`Gerado pelo Gestor Dental PRO em ${new Date().toLocaleString('pt-BR')} — válido somente com assinatura.`,M,290);doc.text(`Página ${i} de ${n}`,W-M,290,{align:'right'})}
   return entregar(nome,doc.output('blob'))}};
 header();doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(15,31,42);doc.text(titulo,M,y);y+=9;
 if(p){A.kv('Paciente',p.nome);A.kv('CPF',p.cpf||'—');A.kv('Data de nascimento',p.nasc?fmtD(p.nasc)+' ('+idade(p.nasc)+')':'—');A.kv('Telefone',p.tel||'—');A.kv('Convênio',p.convenio||'Particular');y+=2}
 return A;
}

/* ---------- PAGAMENTO POR PIX (chave guardada no banco, não no código) ---------- */
const _pf=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function _crc16(t){let c=0xFFFF;for(let i=0;i<t.length;i++){c^=t.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function pixPayload(x){let p=_pf('00','01')+_pf('26',_pf('00','br.gov.bcb.pix')+_pf('01',x.chave))+_pf('52','0000')+_pf('53','986')+_pf('58','BR')+_pf('59',x.nome.slice(0,25))+_pf('60',x.cidade.slice(0,15))+_pf('62',_pf('05','***'))+'6304';return p+_crc16(p)}

 PIXCODE=pixPayload(x);let qr='';try{const q=qrcode(0,'M');q.addData(PIXCODE);q.make();qr=q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(_){}

  <button type="button" class="btn pixbtn" data-act="pixCopiar" data-t="code">📋 Copiar Pix Copia e Cola</button>

async function abrirClinica(c){
 try{if(CANAL)sb.removeChannel(CANAL)}catch(_){}CANAL=null;
 CLIN=c;PAPEL=c.papel;CLIN_OK=PAPEL==='dono'||PAPEL==='dentista';try{localStorage.setItem('gdp_clin',c.id)}catch(_){}

 try{

 }catch(e){toast('Não foi possível carregar os dados: '+traduz(e))}

}

function assinar(){
 const id=CLIN.id;const ch=sb.channel('gdp-'+id);
 const up=p=>{const r=p.new;if(!r||r.clinica_id!==id||!S[r.colecao])return;const o={...r.dados,id:r.id};const a=S[r.colecao];const i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o);renderLogo()};
 const dl=p=>{const r=p.old;if(!r||!S[r.colecao]||(r.clinica_id&&r.clinica_id!==id))return;S[r.colecao]=S[r.colecao].filter(x=>x.id!==r.id);renderLogo()};
 ['registros',...(CLIN_OK?['clinicos']:[])].forEach(t=>{ch.on('postgres_changes',{event:'INSERT',schema:'public',table:t,filter:'clinica_id=eq.'+id},up).on('postgres_changes',{event:'UPDATE',schema:'public',table:t,filter:'clinica_id=eq.'+id},up).on('postgres_changes',{event:'DELETE',schema:'public',table:t},dl)});
 ch.on('postgres_changes',{event:'*',schema:'public',table:'manual'},()=>{MAN=null;if(UI.view==='manual')render()});
 CANAL=ch.subscribe(st=>setSync(st==='SUBSCRIBED',st==='SUBSCRIBED'?'Sincronizado em tempo real':'Reconectando…'));
}

 admStatus:async d=>{if(d.s==='bloqueado'&&!(await ask('Bloquear esta clínica? Os dados ficam guardados.','Bloquear',true)))return;const {error}=await sb.rpc('admin_status',{p_clinica:d.id,p_status:d.s});if(error)erroSB(error);else carregarAdmin()},
 exportar:async()=>{const dados={geradoEm:new Date().toISOString(),sistema:CONFIG.NOME_SISTEMA,clinica:CLIN?CLIN.nome:'demo',config:S.config};(CLIN_OK?ALLC:COLS).forEach(c=>dados[c]=S[c]);
  const ok=await entregar(`backup-${slug(S.config.nome||'clinica')}-${hoje()}.json`,new Blob([JSON.stringify(dados)],{type:'application/json'}));
  if(ok){S.config.ultimoBackup=hoje();if(mode==='nuvem'){await sb.rpc('marcar_backup',{p_clinica:CLIN.id});CLIN.config={...(CLIN.config||{}),ultimoBackup:hoje()}}else lsSave();render();toast('Backup baixado ✓ Guarde em local seguro (pendrive, Google Drive).')}},
 limpar:async()=>{if(!(await ask('Apagar os dados de agenda, pacientes, financeiro, orçamentos, convênios e estoque? Prontuários reais serão mantidos (guarda legal). Faça um backup antes.','Apagar',true)))return;
  const keep=new Set([...S.anamneses,...S.odontogramas,...S.evolucoes].filter(x=>!x.demo).map(x=>x.pacienteId));
  const alvo={};COLS.forEach(c=>alvo[c]=S[c].filter(o=>!(c==='pacientes'&&keep.has(o.id))));if(CLIN_OK)COLS_CLIN.forEach(c=>alvo[c]=S[c].filter(o=>o.demo));
  for(const c of Object.keys(alvo)){const ids=alvo[c].map(o=>o.id);const set=new Set(ids);S[c]=S[c].filter(o=>!set.has(o.id));
   if(mode==='nuvem'&&ids.length){for(let i=0;i<ids.length;i+=200){const {error}=await sb.from(TAB(c)).delete().eq('clinica_id',CLIN.id).eq('colecao',c).in('id',ids.slice(i,i+200));if(error)erroSB(error)}}}
  lsSave();render();toast(keep.size?`Dados apagados. ${keep.size} paciente(s) com prontuário mantido(s).`:'Dados apagados')}
});
async function gravarLotes(lotes){
 for(const col of Object.keys(lotes)){for(const o of lotes[col]){const i=S[col].findIndex(x=>x.id===o.id);if(i>=0)S[col][i]=o;else S[col].push(o)}}
 render();
 if(mode!=='nuvem'){lsSave();return}
 for(const col of Object.keys(lotes)){if(!lotes[col].length)continue;if(COLS_CLIN.includes(col)&&!CLIN_OK)continue;
  const rows=lotes[col].map(o=>linha(col,o));
  for(let i=0;i<rows.length;i+=400){const chunk=rows.slice(i,i+400);const {error}=col==='evolucoes'?await sb.from('clinicos').upsert(chunk,{onConflict:'clinica_id,colecao,id',ignoreDuplicates:true}):await sb.from(TAB(col)).upsert(chunk);if(error){erroSB(error);return}}}
}

const MANUAL_PADRAO=[{"id": "inicio", "ordem": 10, "titulo": "Primeiros passos", "icone": "🚀", "conteudo": "Bem-vindo ao **Gestor Dental PRO**! Este manual explica, passo a passo, tudo o que você pode fazer no sistema. Leia esta seção primeiro: em 10 minutos sua clínica estará pronta para usar.\n\n### 1. Criar a sua conta\n1. Acesse o endereço do sistema no computador ou no celular.\n2. Clique na aba **Criar conta grátis**.\n3. Preencha **seu nome**, o **nome da clínica**, seu **WhatsApp**, seu **e-mail** e uma **senha** (mínimo de 6 caracteres).\n4. Clique em **Começar 7 dias grátis**.\n5. Se aparecer a mensagem **Confirme seu e-mail**, abra o e-mail que enviamos (confira também a caixa de spam) e clique no link. Depois, volte ao sistema e clique em **Entrar**.\n\n> 💡 Dica: você ganha **7 dias grátis** com todas as funções liberadas. Não é preciso cartão de crédito.\n\n> ⚠️ Atenção: se você trabalha numa clínica que **já usa** o sistema, **não crie outra clínica**. Peça ao dono para adicionar o seu e-mail em **Equipe** e, depois, crie a sua conta deixando o campo \"Nome da clínica\" em branco. Você entrará direto na clínica certa.\n\n### 2. Entrar no sistema nas próximas vezes\n1. Abra o endereço do sistema.\n2. Na aba **Entrar**, digite seu e-mail e sua senha.\n3. Clique em **Entrar**.\n\n> 💡 Dica: no celular, toque no menu do navegador e escolha **Adicionar à tela inicial**. O sistema vira um ícone, como um aplicativo.\n\n### 3. Esqueci minha senha\n1. Na tela de login, clique em **Esqueci minha senha**.\n2. Digite o seu e-mail e clique em **Enviar link de recuperação**.\n3. Abra o e-mail recebido e clique no link.\n4. Digite a nova senha e clique em **Salvar senha**.\n\n### 4. Configure a clínica (faça isto primeiro)\nAntes de cadastrar pacientes, vá em **Configurações** (último item do menu) e preencha:\n- **Nome da clínica**, **nome do(a) dentista**, **CRO**, **cidade** e **endereço** — aparecem nas mensagens de WhatsApp e nos documentos em PDF.\n- **Custo fixo mensal** — some aluguel, salários, contador, energia, internet, sistema etc.\n- **Horas clínicas por mês** — só as horas em que a cadeira realmente atende.\n- **Impostos** e **taxa da maquininha** em %.\n- **Margem de lucro desejada** e **ticket médio por consulta**.\n\nClique em **Salvar configurações**.\n\n> 💡 Dica: esses números alimentam o cálculo de **custo da hora clínica**, o **preço mínimo** de cada procedimento e a estimativa de **dinheiro perdido** com faltas.\n\n### 5. Ordem recomendada para começar\n1. **Configurações** — custos da clínica.\n2. **Custos e preços** — cadastre seus procedimentos com tempo, material e preço.\n3. **Pacientes** — cadastre seus pacientes (ou só os da semana, para começar).\n4. **Agenda** — marque as consultas.\n5. **Equipe** — adicione a recepção e outros dentistas.\n\n### 6. Conhecendo a tela\n- **Menu lateral (à esquerda)**: leva a cada parte do sistema. No celular, toque no botão **☰** no canto superior esquerdo para abrir.\n- **Números em vermelho no menu**: mostram pendências (ex.: orçamentos parados, parcelas vencidas).\n- **Rodapé do menu**: nome da clínica, seu perfil de acesso, seu e-mail, o indicador **Sincronizado em tempo real** e o botão **Sair**.\n- **Botão ❔ Ajuda**: aparece no topo de cada tela e abre a parte deste manual sobre aquela tela."}, {"id": "painel", "ordem": 20, "titulo": "Painel", "icone": "🏠", "conteudo": "O **Painel** é a primeira tela depois do login. Ele mostra, em segundos, **quanto dinheiro está escapando** da clínica e **o que fazer hoje** para recuperar.\n\n### Quadro \"Dinheiro escapando da clínica agora\"\nÉ a soma de quatro perdas que você ainda pode recuperar:\n- **Faltas no mês** — valor das consultas em que o paciente faltou (usa o valor da consulta ou, se não tiver, o ticket médio das Configurações).\n- **Orçamentos parados +7 dias** — orçamentos em aberto sem contato há mais de 7 dias.\n- **Parcelas vencidas** — valores que pacientes deveriam ter pago e ainda não pagaram.\n- **Glosas de convênio** — valores que as operadoras deixaram de pagar.\n\n### Indicadores\n- **Taxa de faltas (mês)** — meta: abaixo de 10%. Fica vermelho acima de 15%.\n- **Conversão de orçamentos** — quantos orçamentos dos últimos 90 dias foram aprovados. O ideal é de 60% a 80%.\n- **Inadimplência** — percentual das parcelas já vencidas que não foram pagas.\n- **Saldo do caixa (mês)** — entradas menos saídas lançadas no caixa do mês.\n\n### Ações de hoje para recuperar receita\nUma lista automática do que fazer agora. Cada linha tem um botão pronto:\n- **Confirmar consulta de amanhã** — botão **Confirmar** abre o WhatsApp com a mensagem pronta; depois clique em **Confirmado ✓**.\n- **Follow-up de orçamento** — botão **Enviar follow-up** abre o WhatsApp do paciente com uma mensagem de retomada.\n- **Parcela vencida** — botão **Cobrar** (mensagem educada de cobrança) e **Recebido** (dar baixa).\n- **Lembrete de vencimento** — parcelas que vencem nos próximos 3 dias.\n- **Previsão: caixa negativo** — aparece no topo quando o caixa vai ficar abaixo de zero nos próximos 30 dias.\n- **Procedimentos dando prejuízo** — leva aos Alertas de lucro em Custos e preços.\n- **Guias de convênio paradas**, **estoque mínimo**, **pacientes sem retorno** e **backup semanal**.\n\n> 💡 Dica: crie o hábito de abrir o Painel **toda manhã** e zerar a lista de ações. É assim que o sistema devolve dinheiro para a clínica.\n\n### Botão + Agendar\nNo canto superior direito: marca uma nova consulta sem sair do Painel."}, {"id": "agenda", "ordem": 30, "titulo": "Agenda e faltas", "icone": "📅", "conteudo": "Na **Agenda** você marca consultas, confirma pelo WhatsApp, registra faltas e preenche horários vagos com a **lista de espera**.\n\n### Agendar uma consulta\n1. Clique em **+ Agendar**.\n2. Escolha o **paciente** (ele precisa estar cadastrado em Pacientes).\n3. Informe **data** e **hora**.\n4. Digite o **procedimento** (ex.: Avaliação, Limpeza). Se o nome for igual ao de um procedimento cadastrado em Custos e preços, o **valor** é preenchido sozinho.\n5. Confira o **valor previsto** — ele é usado para calcular o prejuízo de uma falta.\n6. Clique em **Salvar**.\n\n> ⚠️ Atenção: se já existir consulta no mesmo dia e horário, o sistema avisa antes de salvar, para evitar encaixe duplo por engano.\n\n### Navegar entre os dias\n- Use **‹** e **›** para voltar ou avançar um dia, o campo de data para ir a um dia específico e **Hoje** para voltar ao dia atual.\n\n### Status da consulta\nCada consulta mostra um status colorido:\n- **Agendado** (cinza) — marcada, ainda não confirmada.\n- **Confirmado** (azul) — paciente confirmou presença.\n- **Compareceu** (verde) — atendimento realizado.\n- **Faltou** (vermelho) — paciente não veio e não avisou.\n- **Cancelado/Desmarcou** (amarelo) — paciente avisou que não vem.\n\n### Confirmar pelo WhatsApp (o passo que mais reduz faltas)\n1. Na véspera, clique em **Confirmar** na consulta. O WhatsApp abre com a mensagem pronta, com data e horário.\n2. Envie a mensagem.\n3. Quando o paciente responder, clique em **Confirmado**.\n\n> 💡 Dica: o principal motivo de falta é **esquecimento**. Confirmar todas as consultas na véspera é o jeito mais simples de reduzir faltas.\n\n### Registrar o atendimento\n- Clique em **Compareceu** quando o paciente for atendido. A **última visita** do paciente é atualizada sozinha (usada no Retorno de pacientes).\n- Depois, clique em **💰 Receber** para lançar o pagamento no caixa.\n\n### Paciente faltou ou desmarcou\n1. Clique em **Faltou** ou **Desmarcou**.\n2. O horário fica livre e o sistema avisa se houver pessoas na **lista de espera**.\n\n### Lista de espera (preencha horários vagos)\n1. No quadro **Lista de espera**, clique em **+ Adicionar**.\n2. Escolha o paciente e escreva a preferência de horário (ex.: \"manhãs\").\n3. Quando abrir um horário, clique em **Oferecer** (abre o WhatsApp) e, se ele aceitar, em **Encaixar**. A consulta é criada e o paciente sai da lista.\n\n### Editar ou excluir\n- **Editar** muda paciente, data, hora, procedimento ou valor.\n- **✕** exclui a consulta (o sistema pede confirmação)."}, {"id": "pacientes", "ordem": 40, "titulo": "Pacientes", "icone": "👤", "conteudo": "Cadastro de todos os pacientes da clínica, com busca rápida e atalhos.\n\n### Cadastrar um paciente\n1. Clique em **+ Novo paciente**.\n2. Preencha **nome completo** (obrigatório), **WhatsApp**, **CPF**, **nascimento**, **convênio** e **última visita** (se souber).\n3. Use **Observações** para preferências de horário ou informações administrativas.\n4. Clique em **Salvar**.\n\n> 💡 Dica: sempre preencha o **WhatsApp com DDD** (ex.: 34 99999-9999). Sem ele, os botões de mensagem ficam desativados.\n\n> ⚠️ Atenção: o sistema avisa quando já existe paciente com o **mesmo nome, CPF ou telefone**, para evitar cadastro duplicado. Confira antes de clicar em \"Salvar mesmo assim\".\n\n### Buscar\nDigite no campo de busca parte do **nome**, do **telefone** ou do **CPF**. A lista filtra na hora.\n\n### O que aparece na lista\n- Selo vermelho **deve R$ ...** — o paciente tem parcelas vencidas.\n- Selo **⚠ alergia** — visível só para dono e dentista, quando a anamnese registra alergia.\n- **Última visita** em vermelho — paciente há muito tempo sem vir.\n\n### Atalhos de cada paciente\n- **WhatsApp** — abre conversa com o paciente.\n- **Prontuário** — abre odontograma, anamnese e evolução (só dono e dentista).\n- **Agendar** — nova consulta já com o paciente escolhido.\n- **Orçamento** — novo orçamento para o paciente.\n- **Editar** e **✕** (excluir).\n\n### Excluir paciente\n- Apenas **dono** e **dentista** podem excluir pacientes.\n- Paciente que tem **prontuário** não pode ser excluído: a regulamentação do CFO exige guardar o prontuário por no mínimo 10 anos após o último atendimento."}, {"id": "orcamentos", "ordem": 50, "titulo": "Orçamentos", "icone": "📄", "conteudo": "Cada orçamento parado é dinheiro na mesa. Aqui você acompanha todos e faz o **follow-up** no momento certo.\n\n### Criar um orçamento\n1. Clique em **+ Novo orçamento** (ou no botão **Orçamento** do paciente, ou em **Gerar orçamento** no prontuário).\n2. Escolha o **paciente**.\n3. Descreva o **tratamento proposto** (ex.: 2 implantes + coroas).\n4. Informe o **valor total** e a **data**.\n5. Clique em **Salvar**.\n\n### Entendendo os selos de tempo\n- **recente** (verde) — até 2 dias.\n- **3 a 6 dias** (amarelo) — hora de um primeiro contato.\n- **7 a 14 dias** (amarelo) — **faça follow-up**.\n- **15 a 29 dias** (vermelho) — risco alto de perder.\n- **30 dias ou mais** (vermelho) — chance de fechar menor que 10%.\n\n> 💡 Dica: orçamentos retomados em até 15 dias têm de 50% a 70% de chance de fechar. Depois de 30 dias, a chance cai para menos de 10%.\n\n### Fazer follow-up\n1. Clique em **Follow-up**. O WhatsApp abre com uma mensagem oferecendo tirar dúvidas e facilitar o pagamento.\n2. Envie. O sistema registra a data do contato automaticamente e o contador de dias recomeça.\n\n### Paciente aprovou\n1. Clique em **Aprovar**.\n2. Informe a **entrada** (se houver) e a forma de pagamento da entrada.\n3. Informe o **número de parcelas** do restante, o **1º vencimento** e a forma.\n4. Clique em **Aprovar**.\n\nO sistema cria **automaticamente** as parcelas em **Financeiro › Contas a receber** e lança a entrada no **caixa**.\n\n### Paciente recusou\n1. Clique em **Recusou**.\n2. Escolha o **motivo principal** (preço, forma de pagamento, vai pensar, medo, fechou com outra clínica, outro).\n3. Clique em **Registrar**.\n\nO quadro **Por que recusam** mostra os motivos mais comuns. Use isso para ajustar preços e condições.\n\n### Reabrir\nNos recusados, **Reabrir** volta o orçamento para \"em aberto\".\n\n### Abas\n**Em aberto**, **Aprovados**, **Recusados** e **Todos**."}, {"id": "financeiro", "ordem": 60, "titulo": "Financeiro", "icone": "💰", "conteudo": "O Financeiro tem duas abas: **Contas a receber** (parcelas dos pacientes) e **Caixa diário** (entradas e saídas do dia a dia).\n\n### Contas a receber\nOs quadros do topo mostram:\n- **Vencido** — total em atraso.\n- **A vencer em 30 dias**.\n- **Recebido no mês**.\n\nAs parcelas atrasadas aparecem com **fundo vermelho** e os dias de atraso.\n\n### Lançar uma conta a receber manualmente\n1. Clique em **+ Lançar a receber**.\n2. Escolha o paciente, escreva a descrição, o valor total, o número de parcelas, o 1º vencimento e a forma.\n3. Clique em **Salvar**. As parcelas são criadas mês a mês.\n\n> 💡 Dica: ao **aprovar um orçamento**, as parcelas já são criadas sozinhas. Use o lançamento manual só para casos fora dos orçamentos.\n\n### Cobrar e lembrar pelo WhatsApp\n- **Cobrar** (parcela vencida) — mensagem educada, já com o Pix copia e cola no valor da parcela.\n- **Lembrar** (a vencer) — lembrete amigável antes do vencimento.\n\nPara cobrar vários pacientes de uma vez, use o menu **Lembretes de pagamento**. As contas da clínica (aluguel, salários, laboratório) ficam em **Previsão de caixa → Contas a pagar**.\n\n### Dar baixa (paciente pagou)\n1. Clique em **Recebido**.\n2. Confira o **valor recebido**, a **data** e a **forma**.\n3. Clique em **Confirmar**. A parcela fica como paga e a entrada vai para o **caixa** automaticamente.\n\n### Errei a baixa\nEm **Últimos recebimentos**, clique em **Desfazer**. A parcela volta a ficar em aberto e o lançamento do caixa é removido.\n\n### Caixa diário\n1. Clique em **+ Entrada** ou **− Saída**.\n2. Preencha descrição, valor, data, forma e categoria (ex.: Materiais, Laboratório de prótese, Aluguel).\n3. Clique em **Salvar**.\n\nUse o campo **Mês** para ver outros meses. Os quadros mostram **entradas**, **saídas** e **saldo**.\n\n> ⚠️ Atenção: o sistema não é emissor de nota fiscal. Ele organiza o financeiro da clínica; a parte fiscal continua com o seu contador."}, {"id": "lembretes", "ordem": 62, "titulo": "Lembretes de pagamento", "icone": "🔔", "conteudo": "O sistema monta a mensagem de cobrança certa para cada paciente, **já com o Pix no valor exato**. Você só clica e envia.\n\n### Antes de começar: cadastre a chave Pix\n1. Vá em **Configurações**.\n2. Em **Pix para receber dos pacientes**, preencha a **chave Pix da clínica** (CPF, CNPJ, e-mail, celular ou chave aleatória) e o **nome do favorecido** (como aparece no banco).\n3. Clique em **Salvar configurações**.\n\n> 💡 Dica: com a chave cadastrada, cada mensagem leva um **Pix copia e cola** com o valor da parcela. O paciente só cola no app do banco e paga — sem digitar valor nem chave.\n\n### Quem aparece na lista\nPacientes com parcela **vencida** ou que **vence nos próximos 3 dias**. Quem tem várias parcelas em aberto recebe **uma única mensagem** com a lista e o total.\n\n### O tom muda sozinho conforme o atraso\n- **Vence em breve** (até 3 dias antes) — lembrete gentil.\n- **Vence hoje** — aviso amigável.\n- **Atraso de 1 a 7 dias** — \"pode ter sido só um esquecimento\".\n- **Atraso de 8 a 30 dias** — pedido educado para regularizar esta semana.\n- **Atraso acima de 30 dias** — proposta de conversar e renegociar.\n\n### Enviar os lembretes\n1. Abra **Lembretes de pagamento** no menu.\n2. Clique em **▶ Enviar próximo**. O WhatsApp abre com a mensagem pronta do primeiro paciente.\n3. Clique em **Enviar** no WhatsApp e volte ao sistema.\n4. Clique de novo em **▶ Enviar próximo** até zerar a lista.\n\nSe preferir escolher, use o botão **Enviar lembrete** de cada paciente.\n\n### Lembrado hoje ✓\nDepois de enviar, o paciente fica marcado como **lembrado hoje** e sai da contagem do dia. Assim ninguém recebe a mesma cobrança duas vezes no mesmo dia. A linha mostra também **há quantos dias** foi o último lembrete.\n\n> ⚠️ Atenção: quando o paciente já recebeu 3 ou mais lembretes e está com mais de 15 dias de atraso, o sistema sugere **ligar ou renegociar** — insistir só por mensagem desgasta a relação.\n\n### Paciente pagou\nClique em **Recebido** (ou dê baixa no **Financeiro**). A entrada vai para o caixa e o quadro **Recuperado com lembretes** mostra quanto voltou para a clínica no mês graças aos lembretes."}, {"id": "previsao", "ordem": 64, "titulo": "Previsão de caixa", "icone": "📈", "conteudo": "Veja **hoje** como estará o caixa da clínica nos **próximos 30 dias** — e se prepare antes do aperto, em vez de descobrir quando o dinheiro já faltou.\n\n### Passo 1 — Informe o saldo de hoje\n1. Abra **Previsão de caixa** no menu.\n2. Clique em **Informar saldo**.\n3. Digite quanto a clínica tem hoje (conta bancária + dinheiro em caixa) e clique em **Salvar**.\n\nVocê só faz isso uma vez. Daqui pra frente, as entradas e saídas lançadas no **Caixa diário** ajustam o saldo sozinhas. Se notar diferença com o banco, informe o saldo de novo.\n\n### Passo 2 — Cadastre as contas a pagar\n1. Clique em **+ Conta a pagar**.\n2. Preencha descrição, valor, vencimento e categoria.\n3. Em **Repete todo mês?**, escolha **Sim** para contas fixas (aluguel, salários, contador, energia).\n4. Clique em **Salvar**.\n\n> 💡 Dica: contas fixas aparecem sozinhas nos meses seguintes. Ao clicar em **Paguei**, a saída vai para o caixa e a conta do próximo mês já é lançada.\n\n### Como a previsão é montada\n- **Entradas** — as parcelas que os pacientes vão pagar (lançadas no Financeiro ou ao aprovar orçamentos).\n- **Saídas** — as contas a pagar em aberto. Contas atrasadas entram no dia de hoje.\n- **Parcelas atrasadas** não entram, porque não há data certa para chegar. Se você recuperar, o saldo melhora.\n\n### Lendo a tela\n- **Quadros** — saldo hoje, entradas previstas, saídas previstas e saldo em 30 dias (com o menor saldo do período).\n- **Gráfico** — o saldo dia a dia. A parte **vermelha** é quando o caixa fica abaixo de zero.\n- **Próximos movimentos** — cada entrada e saída, em ordem, com o saldo previsto depois dela.\n\n### Alerta de caixa negativo\nSe o caixa for ficar negativo, aparece um aviso vermelho com **a data**, **o pior momento** e **quantos dias você ainda tem para agir**, além de sugestões:\n- cobrar as parcelas atrasadas (e se isso já cobre o buraco);\n- negociar a data das maiores contas;\n- fechar orçamentos em aberto com entrada à vista;\n- chamar de volta pacientes sem retorno.\n\nO mesmo alerta aparece no **Painel**."}, {"id": "convenios", "ordem": 70, "titulo": "Convênios e glosas", "icone": "🛡️", "conteudo": "Descubra quanto cada operadora **realmente paga** e quanto ela **segura**.\n\n### Lançar uma guia\n1. Clique em **+ Lançar guia**.\n2. Escolha o paciente, digite o **convênio**, o **procedimento**, o **nº da guia**, o **valor** e a **data de envio**.\n3. Clique em **Salvar**. A guia fica como **Aguardando**.\n\n### Quando a operadora pagar\n1. Clique em **Paga**.\n2. Informe o **valor que a operadora pagou**.\n3. Clique em **Confirmar**. A entrada vai para o caixa.\n\nSe o valor pago for **menor** que o da guia, a diferença é registrada como **glosa** automaticamente.\n\n### Quando a operadora glosar\n1. Clique em **Glosada**.\n2. Escreva o **motivo informado** (ex.: ausência de radiografia final) e o valor pago, se foi parcial.\n3. Para contestar, clique em **Recorrer** — a guia fica **Em recurso**.\n\n> 💡 Dica: guias **sem pagamento há mais de 30 dias** ficam em vermelho e aparecem no Painel. Cobre a operadora.\n\n### Resultado por operadora\nA tabela mostra, para cada convênio: guias, faturado, recebido, glosado, **% de glosa** e pendente. Use para decidir se vale a pena continuar atendendo cada operadora.\n\n### Procedimentos no prejuízo\nSe um procedimento cadastrado em **Custos e preços** custa mais do que o convênio paga, um aviso aparece no topo da tela."}, {"id": "retorno", "ordem": 80, "titulo": "Retorno de pacientes", "icone": "🔁", "conteudo": "Lista automática dos pacientes que **não vêm há muito tempo** e **não têm consulta marcada**.\n\n### Como funciona\n- Entra na lista quem está sem visita há mais dias do que o definido em **Configurações › Dias para considerar paciente inativo** (padrão: 180 dias), ou quem nunca teve a visita registrada.\n- O quadro **Potencial em consultas** estima quanto a clínica fatura se esses pacientes voltarem.\n\n### Chamar o paciente de volta\n1. Clique em **Convidar**. O WhatsApp abre com um convite para revisão e limpeza.\n2. Se ele aceitar, clique em **Agendar**.\n\n> 💡 Dica: reserve 15 minutos por semana para esta lista. Pacientes antigos já confiam na clínica e voltam com facilidade.\n\n> ⚠️ Atenção: a \"última visita\" é atualizada quando você marca **Compareceu** na Agenda. Se a clínica não marcar a presença, o paciente aparece aqui por engano."}, {"id": "prontuario", "ordem": 90, "titulo": "Prontuários", "icone": "🦷", "conteudo": "O prontuário reúne **odontograma**, **plano de tratamento**, **anamnese**, **evolução clínica** e **documentos para assinatura**.\n\n> ⚠️ Atenção: o prontuário é visível **apenas para dono e dentista**. A recepção não vê dados de saúde.\n\n### Abrir o prontuário\n- Menu **Prontuários** › **Abrir prontuário**, ou botão **Prontuário** na lista de pacientes.\n- No topo aparecem, em destaque, **alergias** (vermelho) e **condições de risco** (amarelo) registradas na anamnese.\n\n### Odontograma\n1. Toque no **dente** desejado.\n2. Escolha a **situação atual** (hígido, cárie, indicado extrair, fraturado, restaurado, canal tratado, coroa/prótese, implante, ausente).\n3. Marque as **faces** envolvidas (mesial, distal, oclusal/incisal, vestibular, lingual/palatina) e escreva uma observação, se quiser.\n4. Para **planejar um procedimento** neste dente, preencha **Procedimento** e **Valor** (o valor vem sozinho da tabela de preços).\n5. Clique em **Salvar**.\n\nA legenda de cores fica abaixo do odontograma. Um **ponto vermelho** no dente indica procedimento planejado.\n\n### Plano de tratamento\n- **+ Procedimento geral** — procedimentos sem dente específico (ex.: profilaxia).\n- **Gerar orçamento** — junta todos os itens planejados num orçamento, que entra no funil de follow-up.\n- **Realizado** — marca o item como feito e cria o registro na **evolução clínica** automaticamente.\n- **✕** — remove um item ainda planejado.\n\n### Anamnese\n1. Aba **Anamnese**.\n2. Preencha queixa principal, tratamento médico, medicamentos, **alergias**, cirurgias, pressão arterial e observações.\n3. Marque as condições que se aplicam (hipertensão, diabetes, problemas de coagulação etc.).\n4. Clique em **Salvar anamnese**.\n5. Clique em **Imprimir para assinatura** e colha a assinatura do paciente.\n\n> 💡 Dica: cada vez que você salva, a versão anterior fica guardada no histórico.\n\n### Evolução clínica\n1. Aba **Evolução clínica**.\n2. Confira data e hora, informe dente(s) e procedimento e descreva o atendimento (materiais, anestesia, intercorrências, orientações).\n3. Clique em **Registrar no prontuário** e confirme.\n\n> ⚠️ Atenção: por exigência ética, os registros **não podem ser editados nem apagados**. Para corrigir, clique em **Retificar**: o registro original continua visível e a correção fica ligada a ele.\n\n### Documentos em PDF\nAba **Documentos** › **Gerar PDF**:\n- **Ficha de anamnese** — com declaração do paciente.\n- **Plano de tratamento e orçamento**.\n- **Termo de consentimento do tratamento**.\n- **Termo de consentimento LGPD** — autorização para uso dos dados.\n- **Prontuário completo** — para arquivo.\n\n> ⚠️ Atenção: os documentos têm validade com **assinatura em papel** do paciente (ou responsável) e do dentista. Guarde as vias assinadas por no mínimo 10 anos após o último atendimento."}, {"id": "estoque", "ordem": 100, "titulo": "Estoque", "icone": "📦", "conteudo": "Controle de materiais para não faltar nada no meio do atendimento e evitar compras de última hora, que saem mais caras.\n\n### Cadastrar um material\n1. Clique em **+ Novo material**.\n2. Informe nome, quantidade atual, unidade (un, cx, tubete), **estoque mínimo**, custo unitário e fornecedor.\n3. Clique em **Salvar**.\n\n### Usar e repor\n- **− Usar** — dá baixa da quantidade usada.\n- **+ Entrada** — registra uma compra. Você pode lançar a saída no caixa automaticamente.\n\n### Alerta de estoque mínimo\nQuando a quantidade chega ao mínimo, a linha fica **vermelha** com o selo **Repor**, o número aparece no menu e o aviso vai para o Painel.\n\n> 💡 Dica: defina o mínimo pensando em quantos dias o fornecedor leva para entregar."}, {"id": "precos", "ordem": 110, "titulo": "Custos e preços", "icone": "💲", "conteudo": "Descubra quanto custa cada hora de cadeira e se cada procedimento **dá lucro** — no particular e no convênio.\n\n### Como o cálculo funciona\n- **Custo da hora clínica** = custo fixo mensal ÷ horas clínicas por mês.\n- **Custo real do procedimento** = (tempo de cadeira × custo da hora) + material + laboratório.\n- **Lucro particular** = preço − impostos − taxa da maquininha − custo real.\n- **Lucro convênio** = valor pago pelo convênio − impostos − custo real.\n- **Preço mínimo** = o preço que cobre todos os custos e ainda garante a sua margem desejada.\n\n### Cadastrar um procedimento\n1. Clique em **+ Procedimento**.\n2. Informe nome, **tempo de cadeira** (minutos), **custo de material**, **custo de laboratório**, **preço particular** e **quanto o convênio paga** (0 se não atende convênio).\n3. Clique em **Salvar**.\n\n### Lendo a tabela\n- Linha **vermelha** — o procedimento dá **prejuízo** (no particular ou no convênio).\n- **abaixo do ideal** — o preço cobrado está abaixo do preço mínimo sugerido.\n\n### Alertas de lucro\nAcima da tabela, o sistema compara o **preço cobrado** com o **custo real** de cada procedimento e avisa:\n- 🚨 **Prejuízo no particular** — quanto você perde a cada atendimento e, se o procedimento foi feito nos últimos 90 dias, **quanto já perdeu** no período.\n- 📉 **Margem baixa** — dá lucro, mas abaixo da margem desejada das Configurações.\n- 🛡️ **Prejuízo no convênio** — o valor pago pela operadora não cobre o custo. Renegocie ou limite esses horários.\n\n### Reajustar o preço com um clique\n1. No alerta, clique em **Reajustar para R$ …** (o preço ideal, arredondado para cima).\n2. Confirme. O novo preço passa a valer nos próximos agendamentos.\n\n> ⚠️ Atenção: orçamentos já feitos **não mudam**. O reajuste vale só daqui pra frente.\n\nO Painel também avisa quando há procedimentos com prejuízo.\n\n> 💡 Dica: mantenha os números das **Configurações** atualizados. Se o aluguel subir, o custo da hora sobe e os preços mínimos mudam sozinhos."}, {"id": "equipe", "ordem": 120, "titulo": "Equipe e perfis", "icone": "👥", "conteudo": "Só o **dono** da clínica vê o menu **Equipe**. Aqui você decide quem acessa o sistema e o que cada pessoa vê.\n\n### Perfis de acesso\n- **Dono(a)** — tudo: configurações, equipe, prontuário, financeiro e assinatura.\n- **Dentista** — prontuário, agenda, pacientes, orçamentos e financeiro. Não altera configurações nem equipe.\n- **Recepção** — agenda, pacientes, orçamentos e financeiro. **Não vê o prontuário** nem dados de saúde e não exclui pacientes.\n\n### Adicionar uma pessoa\n1. Clique em **+ Adicionar pessoa**.\n2. Informe **nome**, **e-mail** e **perfil**.\n3. Clique em **Adicionar**.\n4. Peça para a pessoa entrar no endereço do sistema, clicar em **Criar conta grátis** e usar **o mesmo e-mail**, deixando \"Nome da clínica\" em branco. Ela entra direto na sua clínica.\n\n> 💡 Dica: se a pessoa já tem conta, ela é adicionada na hora e só precisa atualizar a página.\n\n### Mudar o perfil ou remover\n- Troque o perfil na lista (o efeito é imediato).\n- **Remover** tira o acesso à clínica. Os dados lançados por ela continuam no sistema.\n- **Cancelar** desfaz um convite que ainda não virou cadastro.\n\n> ⚠️ Atenção: cada pessoa deve ter **o seu próprio login**. Não compartilhe senhas: assim você sabe quem fez cada registro e protege os dados dos pacientes.\n\n### Trabalho em várias clínicas\nUm dentista pode fazer parte de mais de uma clínica. Use **Trocar clínica** no rodapé do menu."}, {"id": "config", "ordem": 130, "titulo": "Configurações e backup", "icone": "⚙️", "conteudo": "Somente o **dono** vê o menu **Configurações**.\n\n### Dados da clínica\nNome da clínica, dentista responsável, CRO, cidade e endereço — usados nas mensagens e nos documentos em PDF.\n\n### Custos e metas\nCusto fixo mensal, horas clínicas por mês, impostos (%), taxa da maquininha (%), margem desejada (%), ticket médio por consulta e dias para considerar paciente inativo. Clique em **Salvar configurações**.\n\n### Pix para receber dos pacientes\nCadastre a **chave Pix da clínica** e o **nome do favorecido**. Eles vão nos **Lembretes de pagamento**, com o Pix copia e cola já no valor da parcela.\n\n### Backup (faça toda semana)\n1. Clique em **Baixar backup**.\n2. Confirme o download. Um arquivo **.json** é salvo no seu computador ou celular.\n3. Guarde o arquivo num lugar seguro: pendrive, Google Drive ou e-mail.\n\n> 💡 Dica: o Painel avisa quando o último backup tem mais de 7 dias.\n\n### Restaurar backup\n1. Clique em **Restaurar backup**.\n2. Escolha o arquivo .json.\n3. Clique em **Restaurar**. Os registros são adicionados ou atualizados; nada é apagado.\n\n### Demonstração\n- **Carregar demonstração** — preenche a clínica com dados fictícios para conhecer o sistema.\n- **Apagar dados** — apaga agenda, pacientes, financeiro, orçamentos, convênios e estoque. **Prontuários reais nunca são apagados** (guarda legal).\n\n> ⚠️ Atenção: antes de começar a usar com pacientes reais, apague os dados de demonstração e faça o primeiro backup.\n\n### Ver a demonstração sem mexer na clínica\nNo rodapé do menu, clique em **🎬 Ver demonstração**. Para voltar, clique em **⟵ Sair da demonstração**."}, {"id": "assinatura", "ordem": 140, "titulo": "Assinatura e teste grátis", "icone": "🎁", "conteudo": "### Teste grátis\n- Toda clínica nova ganha **7 dias grátis** com tudo liberado.\n- Uma faixa amarela no topo mostra quantos dias faltam.\n- O dono vê o botão **Assinar agora**, que abre o WhatsApp do suporte.\n\n### Fim do teste ou assinatura vencida\n- O acesso é pausado e aparece a tela 🔒 com o botão **Assinar** ou **Renovar pelo WhatsApp**.\n- **Seus dados ficam guardados com segurança** — nada é perdido.\n- Depois de pagar, clique em **Já paguei — atualizar**. O acesso volta assim que o pagamento é confirmado.\n\n### Aviso de vencimento\nTrês dias antes de vencer, o dono vê um aviso com o botão **Renovar**.\n\n> 💡 Dica: para não ter interrupção, renove antes do vencimento."}, {"id": "whatsapp", "ordem": 150, "titulo": "Mensagens de WhatsApp", "icone": "💬", "conteudo": "O sistema prepara mensagens prontas para confirmação, follow-up, cobrança, lembrete e convite de retorno.\n\n### Como enviar\n1. Clique no botão verde (ex.: **Confirmar**, **Cobrar**, **Convidar**).\n2. O WhatsApp abre (no celular, o aplicativo; no computador, o WhatsApp Web ou Desktop) com a mensagem já escrita.\n3. Revise, se quiser, e clique em **Enviar**.\n\n> ⚠️ Atenção: o sistema **não envia sozinho**. Alguém precisa clicar em enviar. Isso protege o número da clínica contra bloqueios.\n\n### O botão está apagado\nO paciente está sem telefone cadastrado. Edite o paciente e preencha o **WhatsApp com DDD**.\n\n### No computador\nDeixe o **WhatsApp Web** (web.whatsapp.com) aberto e conectado no mesmo navegador para os botões abrirem mais rápido."}, {"id": "seguranca", "ordem": 160, "titulo": "Segurança e LGPD", "icone": "🔒", "conteudo": "### Como seus dados são protegidos\n- Cada clínica vê **somente os próprios dados**, mesmo usando o mesmo endereço.\n- A recepção **não acessa** prontuário nem dados de saúde.\n- Registros da evolução clínica **não podem ser alterados** nem apagados.\n- Pacientes com prontuário **não podem ser excluídos**.\n- Clínica com assinatura vencida não lê nem grava dados até a renovação.\n\n### Boas práticas\n- Use uma **senha forte** e não compartilhe.\n- Clique em **Sair** ao usar computadores compartilhados.\n- Dê a cada funcionário o **perfil certo** em Equipe e remova quem sair da clínica.\n- Faça o **backup semanal**.\n- Peça ao paciente para assinar o **Termo de consentimento LGPD** (Prontuários › Documentos).\n\n> ⚠️ Atenção: os documentos clínicos gerados pelo sistema valem **impressos e assinados**. O sistema organiza o prontuário, mas não substitui a assinatura em papel."}, {"id": "faq", "ordem": 170, "titulo": "Dúvidas frequentes", "icone": "❓", "conteudo": "### Não consigo entrar\n- Confira se o e-mail está certo e se o **Caps Lock** está desligado.\n- Use **Esqueci minha senha** para criar uma nova.\n- Se aparecer \"Confirme seu e-mail\", procure o e-mail de confirmação também no **spam**.\n\n### Criei a conta mas caí numa clínica vazia / em outra clínica\nVocê pode ter criado uma clínica nova sem querer. Peça ao dono da clínica correta para adicionar o seu e-mail em **Equipe**, depois atualize a página e use **Trocar clínica**.\n\n### Um funcionário não vê o prontuário\nÉ o esperado para o perfil **Recepção**. Se ele for dentista, o dono deve mudar o perfil para **Dentista** em Equipe.\n\n### Não aparece o menu Configurações ou Equipe\nEsses menus são só do **dono** da clínica.\n\n### Lancei uma baixa errada\nFinanceiro › Contas a receber › **Últimos recebimentos** › **Desfazer**.\n\n### Errei um registro no prontuário\nUse **Retificar** no registro. O original continua visível, como manda a ética odontológica.\n\n### O botão do WhatsApp não funciona\nO paciente precisa ter o **WhatsApp com DDD** no cadastro. No computador, mantenha o WhatsApp Web conectado.\n\n### A tela ficou desatualizada\nAtualize a página (**F5**, ou **Ctrl+F5** no computador). No rodapé do menu, o indicador deve mostrar **Sincronizado em tempo real**.\n\n### O sistema funciona no celular?\nSim. Use pelo navegador do celular e toque em **☰** para abrir o menu. Dica: adicione o sistema à tela inicial.\n\n### Meus dados somem se eu trocar de computador?\nNão. Os dados ficam guardados na nuvem. Entre com o mesmo e-mail e senha em qualquer aparelho."}, {"id": "suporte", "ordem": 180, "titulo": "Suporte", "icone": "🤝", "conteudo": "Antes de chamar o suporte, use o campo **Buscar no manual** no topo desta tela: digite uma palavra (ex.: \"baixa\", \"falta\", \"senha\") e veja as seções relacionadas.\n\n### Ainda ficou com dúvida?\nClique no botão **Falar com o suporte** no fim desta página. Para agilizar, envie:\n1. O **nome da clínica**.\n2. A **tela** em que você está (ex.: Financeiro).\n3. O que você tentou fazer e o que aconteceu — um **print da tela** ajuda muito.\n\n> 💡 Dica: este manual é atualizado sempre que o sistema ganha novidades. A data da última atualização aparece no topo do manual."}];
/* ===================== MANUAL DO SISTEMA ===================== */

const mdInline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function md(src){const L=String(src||'').split('\n');let h='',lista=null;const fecha=()=>{if(lista){h+=`</${lista}>`;lista=null}};
 for(const raw of L){const l=raw.trim();let m;
  if(!l){fecha();continue}
  if(m=l.match(/^###\s+(.*)/)){fecha();h+=`<h4>${mdInline(m[1])}</h4>`}
  else if(m=l.match(/^\d+[.)]\s+(.*)/)){if(lista!=='ol'){fecha();h+='<ol>';lista='ol'}h+=`<li>${mdInline(m[1])}</li>`}
  else if(m=l.match(/^[-•]\s+(.*)/)){if(lista!=='ul'){fecha();h+='<ul>';lista='ul'}h+=`<li>${mdInline(m[1])}</li>`}
  else if(m=l.match(/^>\s*(.*)/)){fecha();h+=`<div class="mtip ${/⚠|aten[cç][aã]o/i.test(m[1])?'warn':''}">${mdInline(m[1])}</div>`}
  else{fecha();h+=`<p>${mdInline(l)}</p>`}}
 fecha();return h}
function trecho(t,q){const s=String(t).replace(/\s+/g,' ');const i=norm(s).indexOf(q);return (i<0?s.slice(0,150):(i>50?'…':'')+s.slice(Math.max(0,i-50),i+110)+'…').replace(/[#*>]/g,'')}

  corpo=`<div class="small muted" style="margin-bottom:10px">${res.length} seção(ões) encontrada(s) para “${esc(UI.mq)}”</div>`+(res.length?res.map(s=>`<div class="card mres" data-act="manSec" data-id="${esc(s.id)}"><b>${esc(s.icone)} ${esc(s.titulo)}</b><div class="small muted" style="margin-top:4px">${esc(trecho(s.conteudo,q))}</div></div>`).join(''):`<div class="card">${vazio('Nada encontrado','Tente outra palavra, ou veja a seção Suporte.')}</div>`)}
 else corpo=`<article class="card manual"><div class="mhead"><span class="mico">${esc(cur.icone)}</span><div><div class="small muted">Seção ${idx+1} de ${secs.length}</div><h2>${esc(cur.titulo)}</h2></div>${ADMIN&&mode==='nuvem'?`<div class="acts" style="margin-left:auto"><button class="btn s" data-act="manEdit" data-id="${esc(cur.id)}">✏️ Editar</button><button class="btn s d" data-act="manDel" data-id="${esc(cur.id)}">✕</button></div>`:''}</div>
  <div class="mbody">${md(cur.conteudo)}</div>

  <div class="mnav">${idx>0?`<button class="btn" data-act="manSec" data-id="${esc(secs[idx-1].id)}">‹ ${esc(secs[idx-1].titulo)}</button>`:'<span></span>'}${idx<secs.length-1?`<button class="btn p" data-act="manSec" data-id="${esc(secs[idx+1].id)}">${esc(secs[idx+1].titulo)} ›</button>`:''}</div></article>`;
 return head+busca+`<div class="mgrid"><nav class="card mtoc">${toc}</nav><div style="min-width:0">${corpo}</div></div>`;

 doc.setFontSize(10);doc.text('Versão de '+fmtD((man.atualizado||new Date().toISOString()).slice(0,10)),M,H-28);if(CLIN)doc.text('Clínica: '+pdfTxt(CLIN.nome),M,H-22);
 doc.addPage();doc.setTextColor(10,61,68);doc.setFont('helvetica','bold');doc.setFontSize(20);doc.text('Sumário',M,30);doc.setDrawColor(199,154,59);doc.setLineWidth(.8);doc.line(M,34,M+22,34);
 const tocY=[];y=46;secs.forEach((s,i)=>{doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(14,90,99);doc.text(String(i+1).padStart(2,'0'),M,y);doc.setFont('helvetica','normal');doc.setTextColor(30);doc.text(pdfTxt(s.titulo),M+10,y);tocY.push(y);y+=8.4});

 const ensure=h=>{if(y+h>H-18){doc.addPage();header()}};
