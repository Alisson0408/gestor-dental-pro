  :temBase?`<div class="note blue" style="margin-bottom:14px">✅ Pelos lançamentos atuais, seu caixa fica positivo nos próximos 30 dias. Menor saldo previsto: <b>${brl(P.min.s)}</b> em ${fmtD(P.min.d)}.</div>`:'';
 const lista=P.mov.length?`<div class="tw"><table><thead><tr><th>Data</th><th>Movimento</th><th class="right">Valor</th><th class="right">Saldo previsto</th></tr></thead><tbody>${P.mov.map(x=>`<tr class="${x.saldo<0?'alert':''}"><td class="nowrap">${fmtD(x.data)}</td><td>${esc(x.desc)}</td><td class="right nowrap ${x.tipo==='entrada'?'grn':'red'}"><b>${x.tipo==='entrada'?'+':'−'} ${brl(x.valor)}</b></td><td class="right nowrap ${x.saldo<0?'red':''}"><b>${brl(x.saldo)}</b></td></tr>`).join('')}</tbody></table></div>`:vazio('Nada previsto','Não há parcelas a receber nem contas a pagar nos próximos 30 dias.');
 return head+tabs+
 (!c.saldoData?`<div class="note" style="margin-bottom:14px"><b>Primeiro passo:</b> informe quanto tem hoje na conta da clínica (botão “Informar saldo”). Depois cadastre as contas a pagar — a previsão se monta sozinha com as parcelas que seus pacientes vão pagar.</div>`:'')+alerta+
 `<div class="grid g4" style="margin-bottom:14px">${kpi('Saldo hoje',brl(P.ini),c.saldoData?`informado em ${fmtD(c.saldoData)} + caixa`:'informe o saldo do banco',P.ini<0?'bad':'')}${kpi('Entradas previstas',brl(P.ent),'parcelas de pacientes','ok')}${kpi('Saídas previstas',brl(P.sai),'contas a pagar','bad')}${kpi('Saldo em 30 dias',brl(P.fim),`menor saldo: ${brl(P.min.s)}`,P.min.s<0?'bad':'ok')}</div>
 <div class="card" style="margin-bottom:14px"><h3>Saldo previsto dia a dia</h3>${grafPrev(P.serie)}${P.atrasados?`<p class="small muted" style="margin:8px 0 0">Parcelas atrasadas (${brl(P.atrasados)}) não entram na previsão, porque não há data certa para chegar. Se você recuperar, o saldo melhora.</p>`:''}</div>
 <div class="card"><h3>Próximos movimentos</h3>${lista}</div>`;
}
function formPagar(init){
 form(init&&init.id?'Editar conta a pagar':'Nova conta a pagar',[
  {k:'desc',label:'Descrição',req:true,ph:'Ex.: Aluguel da sala'},
  {k:'valor',label:'Valor (R$)',type:'number',half:true,req:true},{k:'venc',label:'Vencimento',type:'date',half:true,req:true,def:hoje()},
  {k:'categoria',label:'Categoria',type:'select',options:CAT_PAGAR,half:true},
  {k:'recorrente',label:'Repete todo mês?',type:'select',options:[['nao','Não'],['mensal','Sim, todo mês']],half:true,help:'Contas fixas aparecem sozinhas nos próximos meses'}
 ],init,async v=>{if(!v.valor){toast('Informe o valor');return false}
  const dup=S.pagar.find(x=>x.id!==(init&&init.id)&&!x.pago&&norm(x.desc)===norm(v.desc)&&x.venc===v.venc);
  if(dup&&!(await ask(`Já existe <b>${esc(dup.desc)}</b> com vencimento em ${fmtD(dup.venc)}. Lançar de novo?`,'Lançar mesmo assim',true)))return;
  await put('pagar',{pago:false,...(init||{}),...v});toast('Conta salva')});
}

/* ===================== IA FINANCEIRA — 3. ALERTA DE PROCEDIMENTO COM PREJUÍZO ===================== */
const preco10=v=>Math.ceil(v/10)*10;
function diagProc(){
 const c=C(),desde=addDias(hoje(),-90);
 return S.procedimentos.map(p=>{const x=calcProc(p);
  const feitos=S.agenda.filter(a=>a.status==='compareceu'&&a.data>=desde&&norm(a.proc)===norm(p.nome)).length;
  const nivel=p.precoParticular>0&&x.margemP<0?'prejuizo':p.precoParticular>0&&x.margemPp<c.margemAlvo/100?'baixa':x.margemC!=null&&x.margemC<0?'convenio':'ok';
  return {p,x,feitos,nivel,ideal:isFinite(x.sugerido)?preco10(x.sugerido):0}}).filter(o=>o.nivel!=='ok')
  .sort((a,b)=>({prejuizo:0,convenio:1,baixa:2}[a.nivel]-{prejuizo:0,convenio:1,baixa:2}[b.nivel])||a.x.margemP-b.x.margemP);
}
function blocoAlertasLucro(){
 const c=C(),ls=diagProc();if(!ls.length)return S.procedimentos.length?`<div class="note blue" style="margin-bottom:14px">✅ Todos os procedimentos cadastrados dão lucro e atingem sua margem de ${c.margemAlvo}%.</div>`:'';
 const it=o=>{const {p,x}=o;
  if(o.nivel==='prejuizo')return `<div class="todo"><div class="ic" style="background:var(--redbg)">🚨</div><div class="tx"><b>${esc(p.nome)}: você perde ${brl(-x.margemP)} a cada atendimento</b><span>Cobra ${brl(p.precoParticular)}, mas o custo real é ${brl(x.custo)} e, depois de impostos e cartão, sobram ${brl(x.liqP)}.${o.feitos?` Feito ${o.feitos}x nos últimos 90 dias = <strong class="red">${brl(-x.margemP*o.feitos)} de prejuízo</strong>.`:''} Para ter ${c.margemAlvo}% de margem, cobre <strong>${brl(o.ideal)}</strong>.</span></div><div class="acts"><button class="btn s p" data-act="ajustarPreco" data-id="${p.id}">Reajustar para ${brl(o.ideal)}</button></div></div>`;
  if(o.nivel==='baixa')return `<div class="todo"><div class="ic" style="background:var(--ambbg)">📉</div><div class="tx"><b>${esc(p.nome)}: margem baixa (${pct(x.margemPp)})</b><span>Lucro de ${brl(x.margemP)} por atendimento, abaixo da sua meta de ${c.margemAlvo}%.${o.feitos?` Feito ${o.feitos}x em 90 dias.`:''} Preço ideal: <strong>${brl(o.ideal)}</strong>.</span></div><div class="acts"><button class="btn s" data-act="ajustarPreco" data-id="${p.id}">Reajustar para ${brl(o.ideal)}</button></div></div>`;
  return `<div class="todo"><div class="ic" style="background:var(--ambbg)">🛡️</div><div class="tx"><b>${esc(p.nome)}: prejuízo de ${brl(-x.margemC)} no convênio</b><span>O convênio paga ${brl(p.precoConvenio)}, mas o custo real é ${brl(x.custo)}. Renegocie com a operadora ou limite esses horários na agenda.</span></div><div class="acts"><a class="btn s" href="#convenios">Ver convênios</a></div></div>`};
 return `<div class="card" style="margin-bottom:14px"><h3>🔎 Alertas de lucro <span class="muted small" style="font-weight:400">— o sistema compara preço cobrado × custo real</span></h3>${ls.map(it).join('')}</div>`;
}
